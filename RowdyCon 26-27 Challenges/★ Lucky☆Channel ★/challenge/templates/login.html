{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>&#9733; Member Login &#9733;</h2>
{% if err %}<p class="err">&#9888; {{ err }}</p>{% endif %}
<form method="post" class="authform">
  <div>Handle: <input type="text" name="username"></div>
  <div>Password: <input type="password" name="password"></div>
  <div><input type="submit" value="Login &#9654;"></div>
</form>
<p class="smol">No account? <a href="{{ url_for('register') }}">Register here</a>.
Membership is free and gets you into the members' Backstage!</p>
{% endblock %}
