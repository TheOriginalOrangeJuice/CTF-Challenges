name: rowdy-puffle-whisperer
services:
  igloo:
    build: .
    image: rowdy-puffle-whisperer:1
    ports:
      - "18116:8080"
    env_file:
      - ../organizer/event.env
    volumes:
      - igloo-data:/data
    cpus: 4
    mem_limit: 4g
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 25s
volumes:
  igloo-data:
