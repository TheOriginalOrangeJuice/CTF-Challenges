# Standalone deploy of ONLY this challenge. From inside the hard/ directory:
#   docker compose up --build            # -> http://localhost:5003
# Override at launch if your infra needs to:
#   FLAG='RCC{custom}' PORT=8003 docker compose up --build
#
# The player is published; the internal flag service (0.0.0.0:9000 inside the
# container) is deliberately NOT published — it's reachable only via SSRF.
services:
  hard:
    build: .
    ports: ["${PORT:-5003}:5000"]
    environment:
      FLAG: "${FLAG:-RCC{userinfo_at_trick_beats_the_allowlist}}"
    restart: unless-stopped
