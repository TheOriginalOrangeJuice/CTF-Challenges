<symbol id="i-close" viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="currentColor" stroke-width="1.5"/></symbol>
<symbol id="i-tri-closed" viewBox="0 0 10 10"><path d="M3 1.5l4.5 3.5L3 8.5z" fill="#fff" stroke="#8a8a8a" stroke-width="1"/></symbol>
<symbol id="i-tri-open" viewBox="0 0 10 10"><path d="M2.5 8.5V2.5l6 6z" fill="#505050"/></symbol>
<symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#000" stroke-width="2"/></symbol>
<symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.5 4h5l1.5 1.5h6.5v8h-13z" fill="url(#g-gold)" stroke="#7a5208" stroke-width=".7"/></symbol>
<symbol id="i-identity" viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10" rx="1" fill="url(#g-metal)" stroke="#555" stroke-width=".7"/><circle cx="5.5" cy="7" r="1.7" fill="#4a8fe0"/><path d="M3 11a2.5 2.5 0 0 1 5 0z" fill="#4a8fe0"/><path d="M9 6.5h4M9 8.5h4M9 10.5h3" stroke="#777" stroke-width=".9"/></symbol>
</svg>

<div id="desktop">
  <div class="dicon" id="dicon" title="TeamSpeak 3 Client"><svg><use href="#i-ts3-big"/></svg><div>TeamSpeak 3 Client</div></div>

  <!-- ============ main window ============ -->
  <div id="window" class="win">
    <div class="titlebar" id="titlebar">
      <svg class="icon"><use href="#i-ts3"/></svg>
      <span class="title">TeamSpeak 3</span>
      <div class="capbtns">
        <div class="cb min" id="btn-min" title="Minimize"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M1 7h8" stroke="#fff" stroke-width="2.5"/><path d="M1 7h8" stroke="#000" stroke-width="2.5" opacity=".35" transform="translate(0 1)"/></svg></div>
        <div class="cb maxb" id="btn-max" title="Maximize"><svg viewBox="0 0 10 10" width="10" height="10"><rect x="1" y="1.5" width="8" height="7" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M1 2.3h8" stroke="#fff" stroke-width="2"/></svg></div>
        <div class="cb close" id="btn-close" title="Close"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M2 2l6 6M8 2L2 8" stroke="#fff" stroke-width="2"/></svg></div>
      </div>
    </div>
    <div class="client">
      <div class="menubar" id="menubar"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="main" id="main">
        <div class="pane tree-pane" id="treepane"><div class="tree" id="tree"></div></div>
        <div class="vsplit" id="vsplit"></div>
        <div class="pane info-pane" id="infopane">
          <div class="banner" id="banner" style="display:none"></div>
          <div class="info" id="info"></div>
        </div>
      </div>
      <div class="hsplit" id="hsplit"></div>
      <div class="chat" id="chat">
        <div class="tabbar" id="tabs"></div>
        <div class="tabpanel"><div class="log" id="log"></div></div>
        <input class="chatinput" id="chatinput" type="text" autocomplete="off" spellcheck="false" disabled>
      </div>
      <div class="statusbar" id="statusbar">
        <svg class="icon" id="status-icon"><use href="#i-player-off"/></svg><span id="status-text">Not connected</span><span id="status-ptt" class="ptt-hint"></span>
        <div class="right"><span id="status-ping"></span></div>
        <div class="sizegrip"></div>
      </div>
    </div>
  </div>

  <!-- ============ taskbar ============ -->
  <div id="taskbar">
    <div class="orb" id="orb" title="Start"><svg viewBox="0 0 20 20" width="20" height="20"><path d="M3 5.5l6-1v5.5H3zM10 4.3l7-1.2v6.9h-7zM3 10.5h6V16l-6-1zM10 10.5h7v6.9l-7-1.2z" fill="#fff" stroke="#9fd0ff" stroke-width=".5"/></svg></div>
    <div class="task active" id="task-ts3"><svg class="icon"><use href="#i-ts3"/></svg><span>TeamSpeak 3</span></div>
    <div class="tray">
      <svg class="icon tray-ts3" id="tray-ts3" title="TeamSpeak 3" style="display:none"><use href="#i-ts3"/></svg>
      <svg class="icon" viewBox="0 0 16 16"><path d="M2 7h2v6H2zM5.5 5h2v8h-2zM9 3h2v10H9zM12.5 1h2v12h-2z" fill="#fff"/></svg>
      <svg class="icon" viewBox="0 0 16 16"><path d="M2.5 6.3h2.2L8 3.2v9.6L4.7 9.7H2.5z" fill="#fff"/><path d="M10 5.6a3.4 3.4 0 0 1 0 4.8M12 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="#fff" stroke-width="1.1"/></svg>
      <div class="clock"><div id="clock-time">00:00</div><div id="clock-date">01.01.2012</div></div>
      <div class="showdesk" title="Show desktop"></div>
    </div>
  </div>
</div>

<script src="js/voice.js"></script>
<script src="js/sounds.js"></script>
<script src="js/app.js"></script>
</body>
</html>
