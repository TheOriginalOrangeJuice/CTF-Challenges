  - mlg

hints:
  - content: "Look at the PNGs one bit plane at a time. Then look at what blend mode the endcard events use."
    cost: 0
  - content: "The saved_state is stale. Every number you need for the endcard comes out of replaying the journal, and Ctrl+Z / Ctrl+Y mean what they mean in every editor."
    cost: 25
  - content: "Each PNG alone is pure noise. Crop -> flip -> place each endcard layer on the 1152x648 canvas and XOR all six together. If you see static, your replay is wrong."
    cost: 50

state: visible
