name: "Final_Final_REAL"
author: "xandernewlun"
category: forensics
description: |
  July 12, 2013. xX_Qu1ckSc0p3r_Xx was *this close* to finishing the
  sickest Solarium frag montage of all time. The ENDCARD had all six
  overlays lined up perfectly for the final pass. Then Montage Studio 12
  crashed mid-save.

  All that came back is the recovery file and the media folder. He swears
  the endcard "had the flag on it" and that he "lined it up pixel perfect,
  then messed with it a bunch, then hit Ctrl+Z until it looked right again."

  Rebuild the final pass.

  ![Montage Studio 12](art/montage_studio_12.png)

value: 300
type: standard

flags:
  - rcc{N0SC0P3D_BY_TH3_UND0_ST4CK}

files:
  - dist/Final_Final_REAL.zip

tags:
  - forensics
